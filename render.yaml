# ============================================================
# render.yaml — PulseAI Backend (Render.com)
# ============================================================

services:
  - type: web
    name: pulseai-backend
    runtime: node
    region: frankfurt
    plan: free

    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: HOSPITAL_DATA_DIR
        value: "../Hospital_Data"

      - key: PORT
        value: "5000"

      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        value: "https://pulse-34ai.vercel.app"

      # ⚠️ Définir dans Render Dashboard > Environment
      - key: MISTRAL_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: HUGGINGFACE_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Secret pour protéger la route /ingest
      - key: INGEST_SECRET
        sync: false